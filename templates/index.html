<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

<h1>📝 Credit Card Approval Form</h1>

<p>Please enter the applicant details below.</p>

<form action="/result" method="POST">

<h2>👤 Personal Information</h2>

<label>Do you own a house?</label>
<select name="FLAG_OWN_REALTY" required>
    <option value="">Select</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>Gender</label>
<select name="CODE_GENDER_1" required>
    <option value="">Select Gender</option>
    <option value="1">Male</option>
    <option value="0">Female</option>
</select>

<label>Do you own a car?</label>
<select name="FLAG_OWN_CAR_1" required>
    <option value="">Select</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<hr>

<h2>👨‍👩‍👧 Family Details</h2>

<label>Number of Children</label>
<input type="number" name="CNT_CHILDREN" placeholder="Example: 2" required>

<label>Number of Family Members</label>
<input type="number" name="CNT_FAM_MEMBERS" placeholder="Example: 4" required>

<label>Total Family Members</label>
<input type="number" name="TOTAL_FAMILY_MEMBERS" placeholder="Example: 4" required>

<hr>

<h2>💰 Financial Details</h2>

<label>Annual Income</label>
<input type="number" name="AMT_INCOME_TOTAL" placeholder="Example: 500000" required>

<label>Income Type</label>
<select name="NAME_INCOME_TYPE" required>
    <option value="">-- Select Income Type --</option>
    <option value="4">Working</option>
    <option value="0">Commercial Associate</option>
    <option value="2">Pensioner</option>
    <option value="3">State Servant</option>
    <option value="1">Student</option>
</select>

<label>Education Level</label>
<select name="NAME_EDUCATION_TYPE" required>
    <option value="">-- Select Education Level --</option>
    <option value="6">No Formal Education</option>
    <option value="5">High School</option>
    <option value="4">Intermediate / 12th Grade</option>
    <option value="3">Diploma</option>
    <option value="2">Bachelor's Degree</option>
    <option value="1">Master's Degree</option>
    <option value="0">Doctorate (Ph.D.)</option>
</select>
<label>Occupation</label>
<select name="OCCUPATION_TYPE" required>
    <option value="">-- Select Occupation --</option>
    <option value="0">Unknown</option>
    <option value="1">Accountant</option>
    <option value="2">Cleaning Staff</option>
    <option value="3">Cooking Staff</option>
    <option value="4">Core Staff</option>
    <option value="5">Drivers</option>
    <option value="6">HR Staff</option>
    <option value="7">High Skill Tech Staff</option>
    <option value="8">IT Staff</option>
    <option value="9">Laborers</option>
    <option value="10">Managers</option>
    <option value="11">Medicine Staff</option>
    <option value="12">Private Service Staff</option>
    <option value="13">Realty Agents</option>
    <option value="14">Sales Staff</option>
    <option value="15">Secretaries</option>
    <option value="16">Security Staff</option>
    <option value="17">Waiters/Barmen Staff</option>
</select>

<label>Age (Years)</label>
<input type="number" name="DAYS_BIRTH" placeholder="Example: 28" required>

<label>Years of Employment</label>
<input type="number" name="DAYS_EMPLOYED" placeholder="Example: 8-9 years" required>

<hr>

<h2>📞 Contact Details</h2>

<label>Work Phone Available?</label>
<select name="FLAG_WORK_PHONE" required>
    <option value="">Select</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>Personal Phone Available?</label>
<select name="FLAG_PHONE" required>
    <option value="">Select</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>Email Available?</label>
<select name="FLAG_EMAIL" required>
    <option value="">Select</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<hr>

<h2>🏠 Housing Information</h2>

<label>House / Apartment</label>
<select name="NAME_HOUSING_TYPE_1">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Municipal Apartment</label>
<select name="NAME_HOUSING_TYPE_2">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Office Apartment</label>
<select name="NAME_HOUSING_TYPE_3">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Rented Apartment</label>
<select name="NAME_HOUSING_TYPE_4">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Living With Parents</label>
<select name="NAME_HOUSING_TYPE_5">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<hr>

<h2>👨‍👩‍👧 Family Status</h2>

<label>Married</label>
<select name="NAME_FAMILY_STATUS_1">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Separated</label>
<select name="NAME_FAMILY_STATUS_2">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Single / Not Married</label>
<select name="NAME_FAMILY_STATUS_3">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Widow</label>
<select name="NAME_FAMILY_STATUS_4">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<hr>

<h2>📊 Credit History</h2>

<label>Credit History Started (Months Ago)</label>
<input type="number" name="open_month" placeholder="Example: 60" required>

<label>Latest Credit Activity (Months Ago)</label>
<input type="number" name="end_month" placeholder="Example: 1" required>

<label>Credit History Duration (Months)</label>
<input type="number" name="window" placeholder="Example: 59" required>

<br>

<input type="submit" value="🔍 Predict Approval">

</form>

</div>

</body>
</html>
